[package]
name = "uwoniri"
version = "0.2.1"
authors = ["Justin Beaurivage <code@beaurivage.io>"]
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/jbeaurivage/uwoniri"
description = "Dynamic window resizing for niri on ultrawide monitors"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "7.0.0"
env_logger = "0.11.9"
fs2 = "0.4.3"
log = "0.4.29"
niri-ipc = "26.4.0"
phf = { version = "0.14.0", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2.0.0"
predicates = "3.1.4"
