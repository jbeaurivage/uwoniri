[package]
name = "uwoniri"
version = "0.1.0"
authors = ["Justin Beaurivage <code@beaurivage.io>"]
edition = "2024"
description = "A tool that automatically maximizes the only window of a niri workspace"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "7.0.0"
env_logger = "0.11.9"
fs2 = "0.4.3"
log = "0.4.29"
niri-ipc = "26.0.0"
phf = { version = "0.14.0", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4.4"
thiserror = "2.0.21"
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2.0.0"
predicates = "3.1.4"
